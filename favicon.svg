<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg" style="width: 300px; margin: 0 auto; display: block;">
  <!-- Фон (градиент как на фото) -->
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="100%">
      <stop offset="0%" style="stop-color:#8a2be2" />
      <stop offset="100%" style="stop-color:#00008b" />
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <rect width="400" height="400" fill="url(#bgGrad)" rx="200" />

  <!-- Внешний круг -->
  <circle cx="200" cy="200" r="180" fill="none" stroke="white" stroke-width="10"/>

  <!-- Текст по кругу (упрощенно) -->
  <text x="200" y="140" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-weight="bold" font-size="24">
    ШКОЛА № 64
  </text>
  <text x="320" y="200" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-weight="bold" font-size="24" transform="rotate(45, 320, 200)">
    ИЖЕВСК
  </text>
  <text x="200" y="340" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-weight="bold" font-size="20">
    ИЩУ СВОЮ ВЫСОТУ
  </text>

  <!-- Ракета (векторная) -->
  <path d="M180 100 L200 60 L220 100 L230 100 L230 220 L210 220 L210 160 L190 160 L190 220 L170 220 L170 100 Z" 
        fill="white" filter="url(#glow)"/>
  
  <!-- Иллюминатор -->
  <circle cx="200" cy="130" r="12" fill="#8a2be2" />

  <!-- Облака (упрощенные) -->
  <path d="M120 260 C120 280 160 280 160 260 C180 260 180 290 200 290 C220 290 220 260 240 260 C260 260 300 280 300 260" 
        fill="white" filter="url(#glow)"/>
  
  <!-- Звезды -->
  <polygon points="200,160 205,175 220,175 208,185 213,200 200,190 187,200 192,185 180,175 195,175" fill="white" />
  <polygon points="150,220 155,235 170,235 158,245 163,260 150,250 137,260 142,245 130,235 145,235" fill="white" />
</svg>

